name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          cmdline-tools-version: latest
          build-tools-version: 34.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./apps/mobile
        run: |
          pnpm install --frozen-lockfile
          cd ..
          pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: ./apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ussttiqknnckzmwhfubb.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hRkJ2VCxlT_29rSPZdqSvQ_w2huueJ6
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: ./apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -la apps/mobile/android/app/build/outputs/apk/release/
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: productivity-suite-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

    outputs:
      apk_path: ${{ steps.verify-apk.outputs.APK_PATH }}
      apk_size: ${{ steps.verify-apk.outputs.APK_SIZE }}